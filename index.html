<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VPN Mini App</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Inter & Unbounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- WebGL Background Canvas with Volumetric Rays -->
  <canvas id="glcanvas"></canvas>

  <!-- App UI Layer -->
  <div class="app-container">
    <!-- Top Header Bar with User Profile -->
    <header class="top-bar">
      <div class="user-pill" id="user-pill">
        <div class="user-avatar" id="user-avatar">
          <span class="avatar-initial">U</span>
        </div>
        <span class="user-name" id="user-name">@username</span>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Online</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-wrapper">
      <!-- Section Header -->
      <div class="section-header">
        <h1 class="section-title">Подписка</h1>
        <p class="section-subtitle">Управление доступом к защищенному соединению</p>
      </div>

      <!-- Glassmorphic Subscription Card (Stub) -->
      <div class="glass-card">
        <div class="card-header">
          <div class="card-badge">
            <span class="badge-dot"></span>
            <span class="badge-label">Не активна</span>
          </div>
          <div class="card-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        </div>

        <div class="card-body">
          <div class="info-row">
            <span class="info-label">Тариф</span>
            <span class="info-value">Базовый (демо)</span>
          </div>
          <div class="info-row">
            <span class="info-label">Трафик</span>
            <span class="info-value">0 GB / &infin;</span>
          </div>
          <div class="info-row">
            <span class="info-label">Срок действия</span>
            <span class="info-value muted">&mdash;</span>
          </div>
          <div class="info-row">
            <span class="info-label">Сервер / Протокол</span>
            <span class="info-value accent">3X-UI VLESS (Скоро)</span>
          </div>
        </div>

        <div class="card-footer">
          <button class="action-btn" id="btn-subscribe">
            <span>Оформить подписку</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
          <div class="card-notice">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>Интеграция с бэкендом 3X-UI в процессе разработки</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="rays.js?v=app1"></script>
</body>
</html>
